name: Windows regression tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          cache: pip
      - name: Install core Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Install FFmpeg
        run: choco install ffmpeg --yes --no-progress
      - name: Create disposable report directory
        run: New-Item -ItemType Directory -Path _SYSTEM/reports -Force | Out-Null
      - name: Check public source and guard regressions
        run: |
          python tools/check_public_tree.py
          python -m unittest discover -s tools -p 'test_*.py' -v
      - name: Host contracts and FFmpeg integration
        run: python -m unittest discover -s _SYSTEM/tests -v
